name: LunaPath backend checks

on:
  # Run validation after changes reach main, not on every draft/PR push.
  # This keeps frontend iteration from flooding the repository owner with CI emails.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
