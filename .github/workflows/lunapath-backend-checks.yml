name: LunaPath backend checks

on:
  # Run validation manually from the Actions tab when a full check is needed.
  # Automatic PR/push runs are paused to stop repeated failure emails.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: ESLint
        run: npm run lint

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
