name: Lunex quality checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "submission/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  live-integration:
    name: Live Horizons integration (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/lunex-next.log 2>&1 &
          echo $! > /tmp/lunex-next.pid

      - name: Wait for local API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/product78/sites > /tmp/lunex-sites.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lunex-next.log
          exit 1

      - name: Run live integration verifier
        env:
          LUNAPATH_BASE_URL: http://127.0.0.1:3000
          HORIZONS_USER_AGENT: Lunex-GitHub-Actions/1.0
        run: npm run test:integration

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/lunex-next.log
